<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f121b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Plan a monthly household budget: necessities, savings and variable spending, payday transfers and savings goals.">
<title>Household Budget Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout idea: a ledger-style planning tool. Summary of where the month's pay goes on top,
   editable budget lines on the left, the payday transfer plan and goals on the right. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #eceff6;
  --ink: #161b2e;
  --ink-2: #4a5270;
  --ink-3: #868da5;
  --line: #dbe0ea;
  --need: #4c63d2;
  --save: #13866f;
  --save-2: #4fb49c;
  --save-3: #0b5e4e;
  --want: #b3477f;
  --ok: #2e7d32;
  --warn: #9a5b00;
  --bad: #c62828;
  --ok-bg: #e5f3e6;
  --warn-bg: #fbf0dc;
  --bad-bg: #fbe5e3;
  --dim: rgba(15, 18, 30, 0.5);
  --spot: var(--need);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f121b;
    --surface: #171b27;
    --surface-2: #1f2434;
    --ink: #e8eaf2;
    --ink-2: #aeb4c8;
    --ink-3: #747b94;
    --line: #2b3144;
    --need: #8496ff;
    --save: #3cc3a3;
    --save-2: #8fe0cb;
    --save-3: #1f9a80;
    --want: #e384bb;
    --ok: #74d07e;
    --warn: #f0b350;
    --bad: #ff7f73;
    --ok-bg: #1c2e21;
    --warn-bg: #33281a;
    --bad-bg: #3a1e1e;
    --dim: rgba(0, 0, 0, 0.62);
    --spot: var(--need);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f121b;
  --surface: #171b27;
  --surface-2: #1f2434;
  --ink: #e8eaf2;
  --ink-2: #aeb4c8;
  --ink-3: #747b94;
  --line: #2b3144;
  --need: #8496ff;
  --save: #3cc3a3;
  --save-2: #8fe0cb;
  --save-3: #1f9a80;
  --want: #e384bb;
  --ok: #74d07e;
  --warn: #f0b350;
  --bad: #ff7f73;
  --ok-bg: #1c2e21;
  --warn-bg: #33281a;
  --bad-bg: #3a1e1e;
  --dim: rgba(0, 0, 0, 0.62);
  --spot: var(--need);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; font-family: var(--font-body); }
p { margin: 0; }
.num, .money, .tab-n, table td, .stat b { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top .sub { color: var(--ink-2); margin-top: 4px; max-width: 62ch; }
.actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.btn {
  font: inherit; font-weight: 600; font-size: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; cursor: pointer;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: 0.9; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); padding: 6px 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.55; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--need); outline-offset: 2px;
}

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }

.banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: var(--radius); background: var(--warn-bg); color: var(--ink); border: 1px solid var(--line); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); }
.tab {
  font: inherit; font-weight: 600; font-size: 14px; background: none; border: none; color: var(--ink-2);
  padding: 10px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left;
}
.tab .tab-n { font-weight: 500; font-size: 12px; color: var(--ink-3); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab:hover { color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-head .meta { font-size: 13px; color: var(--ink-2); }
/* A title with a description wraps the description beside the total, so the total stays top right;
   it drops below only when the text would get narrower than 18em (phones). */
.card-head > div:first-child { flex: 1 1 18em; min-width: 0; }

.summary .stats { display: flex; flex-wrap: wrap; gap: 12px 36px; align-items: flex-end; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }
.stat b { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.stat .chip { margin-top: 6px; text-transform: none; letter-spacing: 0; font-size: 13px; }

.stack { position: relative; height: 34px; display: flex; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.stack > div { height: 100%; min-width: 0; transition: width 0.25s ease; }
.stack .seg-need { background: var(--need); }
.stack .seg-save { background: var(--save); }
.stack .seg-want { background: var(--want); }
.stack .seg-left { background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 6px, var(--line) 6px, var(--line) 12px); }
.stack-wrap { position: relative; padding-top: 4px; }
.income-mark { position: absolute; top: 0; bottom: -4px; width: 0; border-left: 2px dashed var(--bad); }
.income-mark span { position: absolute; top: -18px; left: -2px; transform: translateX(-100%); font-size: 12px; font-weight: 700; color: var(--bad); white-space: nowrap; padding-right: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; }
.legend .k { display: inline-flex; align-items: center; gap: 8px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.legend b { font-variant-numeric: tabular-nums; }

.guide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.guide .g { display: flex; flex-direction: column; gap: 6px; }
.guide .g-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
.guide .g-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
.gbar { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; }
.gbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.gbar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }

.grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.in {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 9px; min-width: 0; width: 100%;
}
.in:hover { border-color: var(--ink-3); }
select.in { padding-right: 4px; cursor: pointer; }
.amt { position: relative; display: flex; align-items: center; }
.amt .cur { position: absolute; left: 9px; color: var(--ink-3); font-size: 14px; pointer-events: none; }
.amt input { padding-left: 20px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

.group { border-left: 4px solid var(--gc); }
.group[data-g="need"] { --gc: var(--need); }
.group[data-g="save"] { --gc: var(--save); }
.group[data-g="want"] { --gc: var(--want); }
.group .total { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.group .desc { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

.rows { display: flex; flex-direction: column; gap: 6px; }
.rows-head, .row {
  display: grid;
  grid-template-columns: minmax(150px, 1fr) 100px 92px 140px 74px 30px;
  gap: 8px; align-items: center;
}
.rows-head { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; padding: 0 0 2px; }
.rows-head .r { text-align: right; }
.row { position: relative; padding-bottom: 6px; }
.row .mo { text-align: right; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .mo small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-3); }
.row .rbar { position: absolute; left: 0; right: 38px; bottom: 0; height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.row .rbar i { display: block; height: 100%; background: var(--gc); border-radius: 2px; transition: width 0.25s ease; }
.icon { font: inherit; width: 30px; height: 30px; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--ink-3); cursor: pointer; font-size: 18px; line-height: 1; }
.icon:hover { color: var(--bad); background: var(--bad-bg); }

.goal { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: -2px 0 6px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
.goal label { display: inline-flex; align-items: center; gap: 6px; }
.goal .in { width: auto; padding: 4px 6px; font-size: 13px; }
.goal .amt .in { width: 104px; }
.goal .amt .cur { font-size: 13px; }
.goal .months { width: 56px; text-align: right; }
.goal-out { font-weight: 600; color: var(--ink); }
.goal-by { display: inline-flex; align-items: center; gap: 6px; }
.gl-st { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.gl-st .chip { font-size: 12px; }

.add { align-self: flex-start; }

.inc-row { display: grid; grid-template-columns: minmax(140px, 1fr) 140px 30px; gap: 8px; align-items: center; }

.flow svg { width: 100%; height: auto; display: block; }
.flow text { font-family: var(--font-body); font-size: 12px; fill: var(--ink); }
.flow text.amt-t { font-weight: 700; font-variant-numeric: tabular-nums; fill: var(--ink-2); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; font-size: 14px; }
.steps li::before { counter-increment: s; content: counter(s); font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
.steps li b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.steps li .why { grid-column: 2 / 4; font-size: 12px; color: var(--ink-3); margin-top: -4px; }
.note { font-size: 13px; color: var(--ink-2); }
.alert { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--bad-bg); color: var(--bad); font-weight: 600; }

.goals { display: flex; flex-direction: column; gap: 14px; }
.gl { display: flex; flex-direction: column; gap: 5px; }
.gl-top { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.gl-top b { font-variant-numeric: tabular-nums; }
.pbar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--save); border-radius: 4px; }
.gl-sub { font-size: 12px; color: var(--ink-2); }

.hd { width: 100%; border-collapse: collapse; font-size: 14px; }
.hd td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.hd td.r { text-align: right; font-weight: 600; white-space: nowrap; padding-left: 10px; }
.hd tr.gh td { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); padding-top: 12px; border-bottom: none; }
.tag { font-size: 11px; color: var(--ink-3); display: block; }
.hd td:first-child { overflow-wrap: anywhere; }
.hd .hd-lines, .hd .hd-note { display: block; font-size: 11px; color: var(--ink-3); }
.hd .hd-note { color: var(--warn); }
.hd-after { margin-top: 8px; }
.hd td.r.neg { color: var(--warn); }
.yr-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px minmax(0, 190px); gap: 8px; align-items: center; font-size: 14px; }
.yr-row label { overflow-wrap: anywhere; }
.yr-row .r { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.yr-head { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.yr-rows { margin-top: 12px; }
.fund-tbl { margin-top: 12px; }
.fund-st { font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 8px; margin-top: 10px; }
.fund-st.ok { background: var(--ok-bg); color: var(--ok); }
.fund-st.warn { background: var(--warn-bg); color: var(--warn); }

.cat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.cat-row .mo { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat-lines { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.cat-line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 220px); gap: 8px; align-items: center; font-size: 14px; }
.cat-line label { overflow-wrap: anywhere; }
.cat-line .faint { font-size: 12px; }
textarea.copybox { width: 100%; min-height: 120px; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }

.cmp-wrap { overflow-x: auto; }
.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
.cmp th, .cmp td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.cmp th:first-child, .cmp td:first-child { text-align: left; padding-left: 0; color: var(--ink-2); font-weight: 500; }
.cmp th { font-size: 13px; font-weight: 700; color: var(--ink); vertical-align: bottom; }
.cmp th button { font: inherit; background: none; border: none; color: inherit; cursor: pointer; padding: 0; text-align: right; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.cmp td.neg { color: var(--bad); font-weight: 600; }
.cmp td.pos { color: var(--warn); font-weight: 600; }

.acct-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.ci-start { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.ci-start .field { min-width: 160px; }
.ci-scn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
.ci-scn label { min-width: 0; }
.ci-scn .in { width: auto; max-width: 100%; padding: 4px 6px; font-size: 13px; }
.ci-rows { display: flex; flex-direction: column; gap: 6px; }
.ci-head, .ci-row { display: grid; grid-template-columns: minmax(0, 1fr) 84px 120px 120px; gap: 8px; align-items: center; font-size: 14px; }
.ci-head { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.ci-head .r, .ci-row .r { text-align: right; font-variant-numeric: tabular-nums; }
.ci-n { overflow-wrap: anywhere; }
.ci-n small { display: block; font-size: 11px; color: var(--ink-3); }
.ci-total { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 600; }
.ci-over { color: var(--warn); font-weight: 600; }
.ci-under { color: var(--ok); font-weight: 600; }
.ci-sub { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
.ci-goals { display: flex; flex-direction: column; gap: 10px; }
.ci-goal { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 4px 10px; align-items: center; font-size: 14px; }
.ci-goal .ci-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--ink-2); }
.ci-assumed { color: var(--ink-3); font-style: italic; }
.ci-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-top: 14px; }
.ci-hist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.ci-hist .btn { font-size: 13px; padding: 4px 8px; }

footer { display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; }

@media (max-width: 980px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 680px) {
  .wrap { padding: 18px 16px 40px; }
  h1 { font-size: 25px; }
  .rows-head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) 104px 30px; grid-template-areas: "n a d" "f c m"; }
  .row > .c-n { grid-area: n; } .row > .c-a { grid-area: a; } .row > .c-d { grid-area: d; }
  .row > .c-f { grid-area: f; } .row > .c-c { grid-area: c; } .row > .c-m { grid-area: m; }
  .row { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .row .rbar { display: none; }
  .guide { grid-template-columns: minmax(0, 1fr); }
  .stat b { font-size: 22px; }
  .cat-line { grid-template-columns: minmax(0, 1fr) minmax(0, 48%); }
  .ci-head { display: none; }
  .yr-head { display: none; }
  .yr-row { grid-template-columns: minmax(0, 1fr) 80px; }
  .yr-row select { grid-column: 1 / -1; }
  .ci-row { grid-template-columns: minmax(0, 1fr) 120px; grid-template-areas: "n a" "p d"; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .ci-row > .ci-n { grid-area: n; } .ci-row > .ci-a { grid-area: a; }
  .ci-row > .ci-p { grid-area: p; text-align: left; font-size: 12px; color: var(--ink-2); } .ci-row > .ci-d { grid-area: d; }
  .ci-row > .ci-p::before { content: 'Planned '; }
  .ci-total { border-bottom: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
.wrap {

</head>
<body>
<div id="root"></div>
<input type="file" id="import-file" class="sr-only" tabindex="-1" aria-hidden="true">
<script>
(function () {
  'use strict';

  var PLAN_KEY = 'household-budget-planner:plan:v1';
  var NAME_KEY = 'household-budget-planner:name';
  var APP_ID = 'household-budget-planner';
  var DATA_V = 2;
  var BACKUP_KEY = 'household-budget-planner:plan:v1-backup';
  var NEWER_MSG = 'This plan was saved by a newer version of the app. Reload while online to update.';
  var FREQ = { mo: { label: 'monthly', k: 1 }, wk: { label: 'weekly', k: 52 / 12 }, yr: { label: 'yearly', k: 1 / 12 } };
  var GROUPS = [
    { key: 'need', name: 'Necessities', desc: 'Bills and essentials you have to pay every month.' },
    { key: 'save', name: 'Savings', desc: 'Moved out first, on payday, so it actually gets saved.' },
    { key: 'want', name: 'Variable', desc: 'Fun, subscriptions, personal spending, and a buffer for surprises.' }
  ];
  var ACCT_ORDER = ['jchk', 'mchk', 'jsav', 'msav', 'inv'];
  var SPEND_ACCTS = ['jchk', 'mchk'];
  var SAVE_ACCTS = ['jsav', 'msav', 'inv'];
  var ACCT_COLOR = { jchk: 'var(--need)', mchk: 'var(--ink-3)', jsav: 'var(--save)', msav: 'var(--save-2)', inv: 'var(--save-3)' };

  var seq = 0;
  function nid() { seq += 1; return 'i' + Date.now().toString(36) + seq.toString(36); }
  function newGoal() { return { mode: 'none', months: 6, amount: 0, saved: 0, by: '' }; }
  function L(g, name, amt, f, acct, goal) {
    var o = { id: nid(), g: g, name: name, amt: amt, f: f || 'mo', acct: acct };
    if (g === 'need' || g === 'want') { o.cat = ''; o.due = 0; }
    if (goal) { if (goal.by === undefined) goal.by = ''; o.goal = goal; }
    return o;
  }

  /* ---------- months ('YYYY-MM', local time) ---------- */
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function pad2(x) { return (x < 10 ? '0' : '') + x; }
  function monthIndex(key) { var p = String(key).split('-'); return parseInt(p[0], 10) * 12 + parseInt(p[1], 10) - 1; }
  function monthKey(i) { var y = Math.floor(i / 12); return y + '-' + pad2(i - y * 12 + 1); }
  function thisMonth(d) { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function prevMonth(d) { return monthKey(monthIndex(thisMonth(d)) - 1); }
  function monthLong(key) { var i = monthIndex(key); return MONTHS[((i % 12) + 12) % 12]; }
  function monthLabel(key) { return monthLong(key).slice(0, 3) + ' ' + Math.floor(monthIndex(key) / 12); }

  /* Example plan shown on first open. Real numbers live only on your devices and in plan files you export. */
  function defaults() {
    var cats = ['Bills & utilities', 'Groceries', 'Transportation', 'Eating out & fun', 'Personal', 'Gifts']
      .map(function (name) { return { id: nid(), name: name }; });
    var CAT_OF = {
      'Rent (not paying yet)': 0, 'Rent': 0, 'Utilities (electric, gas, water)': 0, 'Internet': 0, 'Phone': 0, 'Insurance (car, renters)': 0,
      'Groceries & household supplies': 1,
      'Gas, transit & parking': 2, 'Car registration & maintenance': 2,
      'Dining out & takeout': 3, 'Entertainment & outings': 3, 'Subscriptions (streaming, apps)': 3,
      'Health costs (copays, prescriptions)': 4, 'Personal care': 4, 'Shopping & clothing': 4,
      'Gifts & holidays': 5
    };
    var DUE = { 'Car registration & maintenance': 3, 'Gifts & holidays': 12 };
    var p = example();
    p.cats = cats;
    p.scenarios.forEach(function (s) {
      s.lines.forEach(function (l) {
        if (l.g !== 'need' && l.g !== 'want') return;
        l.cat = CAT_OF[l.name] !== undefined ? cats[CAT_OF[l.name]].id : '';
        l.due = DUE[l.name] || 0;
        if (l.goal) l.goal.by = '';
      });
      s.lines.forEach(function (l) {
        if (l.goal && /^Move-in fund/.test(l.name)) l.goal.by = monthKey(monthIndex(thisMonth()) + 12);
      });
    });
    return p;
  }

  function example() {
    return {
      v: 2,
      cats: [],
      checkins: [],
      fund: { acct: 'jsav', saved: 0 },
      touched: false,
      modifiedAt: 0,
      lastSync: null,
      active: 'now',
      accounts: {
        jchk: { name: 'Joint checking', note: 'Shared bills' },
        mchk: { name: 'My checking', note: 'My own spending' },
        jsav: { name: 'Joint savings', note: 'Emergency fund' },
        msav: { name: 'My savings', note: 'Fun & vacation' },
        inv: { name: 'Retirement / investing', note: 'IRA or brokerage' }
      },
      scenarios: [
        {
          id: 'now', name: 'Now', sub: 'One income, no rent yet', depositTo: 'mchk',
          incomes: [{ id: nid(), name: 'My take-home pay', amt: 4000 }, { id: nid(), name: 'Partner take-home pay', amt: 0 }],
          lines: [
            L('need', 'Rent (not paying yet)', 0, 'mo', 'jchk'),
            L('need', 'Utilities (electric, gas, water)', 120, 'mo', 'jchk'),
            L('need', 'Internet', 60, 'mo', 'jchk'),
            L('need', 'Phone', 80, 'mo', 'jchk'),
            L('need', 'Groceries & household supplies', 600, 'mo', 'jchk'),
            L('need', 'Gas, transit & parking', 150, 'mo', 'jchk'),
            L('need', 'Insurance (car, renters)', 100, 'mo', 'jchk'),
            L('need', 'Health costs (copays, prescriptions)', 50, 'mo', 'jchk'),
            L('need', 'Car registration & maintenance', 600, 'yr', 'jchk'),
            L('save', 'Emergency fund', 700, 'mo', 'jsav', { mode: 'months', months: 6, amount: 0, saved: 0 }),
            L('save', 'Fun & vacation', 300, 'mo', 'msav', { mode: 'amount', months: 6, amount: 3000, saved: 0 }),
            L('save', 'Move-in fund (deposit, first month, movers)', 400, 'mo', 'jsav', { mode: 'amount', months: 6, amount: 6000, saved: 0 }),
            L('save', 'Extra retirement / investing', 0, 'mo', 'inv'),
            L('want', 'Dining out & takeout', 250, 'mo', 'jchk'),
            L('want', 'Entertainment & outings', 120, 'mo', 'jchk'),
            L('want', 'Subscriptions (streaming, apps)', 50, 'mo', 'jchk'),
            L('want', 'Shopping & clothing', 120, 'mo', 'jchk'),
            L('want', 'Personal care', 60, 'mo', 'jchk'),
            L('want', 'Gifts & holidays', 800, 'yr', 'jchk'),
            L('want', 'Personal spending: me', 150, 'mo', 'mchk'),
            L('want', 'Personal spending: partner', 150, 'mo', 'jchk'),
            L('want', 'Buffer for surprises', 100, 'mo', 'jchk')
          ]
        },
        {
          id: 'later', name: 'Both working + rent', sub: 'Both paychecks into joint', depositTo: 'jchk',
          incomes: [{ id: nid(), name: 'My take-home pay', amt: 4000 }, { id: nid(), name: 'Partner take-home pay', amt: 0 }],
          lines: [
            L('need', 'Rent', 2500, 'mo', 'jchk'),
            L('need', 'Utilities (electric, gas, water)', 150, 'mo', 'jchk'),
            L('need', 'Internet', 60, 'mo', 'jchk'),
            L('need', 'Phone', 80, 'mo', 'jchk'),
            L('need', 'Groceries & household supplies', 650, 'mo', 'jchk'),
            L('need', 'Gas, transit & parking', 200, 'mo', 'jchk'),
            L('need', 'Insurance (car, renters)', 130, 'mo', 'jchk'),
            L('need', 'Health costs (copays, prescriptions)', 50, 'mo', 'jchk'),
            L('need', 'Car registration & maintenance', 600, 'yr', 'jchk'),
            L('save', 'Emergency fund', 700, 'mo', 'jsav', { mode: 'months', months: 6, amount: 0, saved: 0 }),
            L('save', 'Fun & vacation', 400, 'mo', 'msav', { mode: 'amount', months: 6, amount: 3000, saved: 0 }),
            L('save', 'Extra retirement / investing', 0, 'mo', 'inv'),
            L('want', 'Dining out & takeout', 300, 'mo', 'jchk'),
            L('want', 'Entertainment & outings', 150, 'mo', 'jchk'),
            L('want', 'Subscriptions (streaming, apps)', 50, 'mo', 'jchk'),
            L('want', 'Shopping & clothing', 150, 'mo', 'jchk'),
            L('want', 'Personal care', 60, 'mo', 'jchk'),
            L('want', 'Gifts & holidays', 800, 'yr', 'jchk'),
            L('want', 'Personal spending: me', 200, 'mo', 'mchk'),
            L('want', 'Personal spending: partner', 200, 'mo', 'jchk'),
            L('want', 'Buffer for surprises', 150, 'mo', 'jchk')
          ]
        }
      ]
    };
  }

  /* ---------- storage ---------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function validShape(p) {
    return !!(p && Array.isArray(p.scenarios) && p.scenarios.length && p.accounts &&
      p.scenarios.every(function (s) { return s && Array.isArray(s.lines) && Array.isArray(s.incomes); }));
  }
  // Ids and months end up inside HTML attributes, so a plan (stored or imported) must use only safe ones,
  // and every structure the app walks must be there; otherwise the plan is refused rather than half-loaded.
  var ID_RE = /^[A-Za-z0-9_:-]{1,80}$/, MONTH_RE = /^\d{4}-(0[1-9]|1[0-2])$/;
  function okId(x) { return typeof x === 'string' && ID_RE.test(x); }
  function okObj(x) { return !!x && typeof x === 'object'; }
  function validDeep(p) {
    return p.scenarios.every(function (s) {
      return okId(s.id) &&
        s.incomes.every(function (x) { return okObj(x) && okId(x.id); }) &&
        s.lines.every(function (l) {
          return okObj(l) && okId(l.id) && (l.cat === undefined || l.cat === '' || okId(l.cat)) &&
            (!l.goal || (okObj(l.goal) && (!l.goal.by || MONTH_RE.test(l.goal.by))));
        });
    }) &&
      p.cats.every(function (ct) { return okObj(ct) && okId(ct.id); }) &&
      p.checkins.every(function (ci) {
        return okObj(ci) && MONTH_RE.test(ci.month) && Array.isArray(ci.spend) && Array.isArray(ci.goals) &&
          ci.spend.every(function (r) { return okObj(r) && okId(r.key); }) &&
          ci.goals.every(function (g) { return okObj(g) && okId(g.line); }) &&
          (ci.fund === null || ci.fund === undefined || okObj(ci.fund));
      }) &&
      (p.fund.acct === '' || SAVE_ACCTS.indexOf(p.fund.acct) >= 0);
  }
  function validPlan(p) {
    return validShape(p) && p.v === DATA_V && Array.isArray(p.cats) && Array.isArray(p.checkins) &&
      okObj(p.fund) && validDeep(p);
  }

  // Upgrades a v1 plan to v2 (v2 passes through). Works on a copy, only adds missing fields,
  // keeps everything else (unknown fields included). Returns null if the result isn't a valid plan.
  function migrate(p) {
    if (!p || typeof p !== 'object') return null;
    var q = JSON.parse(JSON.stringify(p));
    if (q.v === 1) {
      if (!validShape(q)) return null;
      if (!Array.isArray(q.cats)) q.cats = [];
      if (!Array.isArray(q.checkins)) q.checkins = [];
      if (!q.fund || typeof q.fund !== 'object') q.fund = { acct: '', saved: 0 };
      q.scenarios.forEach(function (s) {
        s.lines.forEach(function (l) {
          if (!l || typeof l !== 'object') return;
          if (l.g === 'need' || l.g === 'want') {
            if (l.cat === undefined) l.cat = '';
            if (l.due === undefined) l.due = 0;
          }
          if (l.goal && typeof l.goal === 'object' && l.goal.by === undefined) l.goal.by = '';
        });
      });
      q.v = 2;
    }
    return validPlan(q) ? q : null;
  }

  // A plan saved by a newer version of the app must never be overwritten by this one:
  // show the example plan, save nothing, and block export/import until a reload brings the new app.
  function tooNew(p) { return !!(p && typeof p === 'object' && typeof p.v === 'number' && p.v > DATA_V); }

  // Reads the stored plan's raw JSON, on load and when another window saves the plan.
  // Returns { plan, newer, upgraded }: plan is a valid current plan (a v1 plan upgraded) or null.
  // A copy of a plan that had to be upgraded, in case the upgrade itself ever has a bug, or of
  // something stored that can't be read, goes to BACKUP_KEY (once) before anything can save over it.
  function readStored(raw) {
    var p = null, plan = null;
    try {
      p = JSON.parse(raw || 'null');
      if (tooNew(p)) return { plan: null, newer: true, upgraded: false };
      plan = p && p.v === 1 ? migrate(p) : (validPlan(p) ? p : null);
    } catch (e) { plan = null; }
    var upgraded = !!plan && p.v === 1;
    if (raw && (upgraded || !plan) && !lsGet(BACKUP_KEY)) lsSet(BACKUP_KEY, raw);
    return { plan: plan, newer: false, upgraded: upgraded };
  }

  var seenRaw = lsGet(PLAN_KEY); // the stored plan as this window last read or wrote it
  var loaded = readStored(seenRaw);
  var blocked = loaded.newer;
  var migratedOnLoad = loaded.upgraded;
  var state = loaded.plan || defaults();
  var deviceName = lsGet(NAME_KEY) || '';
  var savedAt = state.modifiedAt || 0;
  var storageOk = true;
  function newerBanner() { return { kind: 'error', html: '<b>' + esc(NEWER_MSG) + '</b>' }; }
  var TOUR_KEY = 'household-budget-planner:tour-seen';
  var banner = blocked ? newerBanner() : (lsGet(TOUR_KEY) ? null : { kind: 'tour' });          // {kind:'import'|'error'|'info', ...}
  var pendingDelete = null;
  var pendingDeleteCat = null;
  var pendingCiDel = null;   // month of a check-in armed for deletion
  var ciView = null;        // month the check-in card shows, or null for the default
  var ciShown = null;       // month the card is currently showing (set while rendering)
  var pendingReset = false;
  var copyFallback = false;
  // A month opened from the history and armed deletes belong to the plan on screen; a new plan starts without them.
  function resetView() { ciView = null; pendingCiDel = null; pendingDeleteCat = null; pendingDelete = null; }

  if (migratedOnLoad) persist();

  if (navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist().catch(function () {}); } catch (e) { /* ignore */ }
  }

  function persist() {
    if (blocked) return;
    var json = JSON.stringify(state);
    storageOk = lsSet(PLAN_KEY, json);
    if (storageOk) { savedAt = Date.now(); seenRaw = json; }
    renderSaveStatus();
  }

  function scn() {
    for (var i = 0; i < state.scenarios.length; i++) if (state.scenarios[i].id === state.active) return state.scenarios[i];
    state.active = state.scenarios[0].id;
    return state.scenarios[0];
  }
  function findLine(s, id) { for (var i = 0; i < s.lines.length; i++) if (s.lines[i].id === id) return s.lines[i]; return null; }
  function findInc(s, id) { for (var i = 0; i < s.incomes.length; i++) if (s.incomes[i].id === id) return s.incomes[i]; return null; }
  function findCat(id) { for (var i = 0; i < state.cats.length; i++) if (state.cats[i].id === id) return state.cats[i]; return null; }
  // '' when the line has no category or points at one that no longer exists.
  function catName(id) { var ct = id ? findCat(id) : null; return ct ? (String(ct.name || '').trim() || 'Untitled category') : ''; }
  function isSpend(l) { return l.g === 'need' || l.g === 'want'; }
  function isYearly(l) { return isSpend(l) && l.f === 'yr'; }
  function fundOn() { return !!(state.fund && state.fund.acct); }
  function dueOf(l) { var d = parseInt(l.due, 10); return d >= 1 && d <= 12 ? d : 0; }
  function monthNum(key) { return ((monthIndex(key) % 12) + 12) % 12 + 1; }

  /* ---------- math ---------- */
  function n(v) { var x = parseFloat(v); return isFinite(x) && x > 0 ? x : 0; }
  function monthly(l) { return n(l.amt) * (FREQ[l.f] ? FREQ[l.f].k : 1); }
  function calc(s) {
    var I = 0, g = { need: 0, save: 0, want: 0 }, by = {};
    s.incomes.forEach(function (x) { I += n(x.amt); });
    var fund = 0, toFund = fundOn();
    s.lines.forEach(function (l) {
      var m = monthly(l); if (g[l.g] === undefined) return;
      g[l.g] += m;
      // With the yearly-costs fund on, a yearly line's monthly share is moved to the fund each payday.
      var a = toFund && isYearly(l) ? state.fund.acct : l.acct;
      if (toFund && isYearly(l)) fund += m;
      by[a] = (by[a] || 0) + m;
    });
    var P = g.need + g.save + g.want;
    return { I: I, g: g, P: P, left: I - P, by: by, fund: fund, rate: I > 0 ? g.save / I : 0 };
  }
  function goalTarget(l, c) {
    if (!l.goal || l.goal.mode === 'none') return 0;
    if (l.goal.mode === 'months') return n(l.goal.months) * c.g.need;
    return n(l.goal.amount);
  }
  function goalInfo(l, c) {
    var G = goalTarget(l, c), B = l.goal ? goalBalance(l) : 0, s = monthly(l);
    if (!l.goal || l.goal.mode === 'none' || G <= 0) return null;
    var info = { G: G, B: B, s: s, frac: Math.min(B / G, 1) };
    if (B >= G) { info.done = true; return info; }
    if (s <= 0) { info.never = true; return info; }
    info.months = Math.ceil((G - B) / s);
    // Count from the same base month as the goal status: the latest check-in, else the end of last month.
    var e = latestGoalEntry(l);
    info.date = monthLabel(monthKey(monthIndex(e ? e.ci.month : prevMonth(new Date())) + info.months));
    return info;
  }
  var HD_NOTE = 'Enter these as monthly limits on your Honeydue categories. Group lines into categories in the Honeydue categories card. Savings stays out of Honeydue; the transfers above handle it.';
  var YEARLY_NOTE = 'includes yearly costs at 1/12 a month; expect a spike in the month they’re paid';

  // Honeydue limits: one item per category (sum of its lines) and per line not in a category.
  function hdItems(s) {
    var items = [], byCat = {};
    state.cats.forEach(function (ct) {
      var it = { kind: 'cat', id: ct.id, name: catName(ct.id), amt: 0, lines: [], note: '' };
      byCat[ct.id] = it; items.push(it);
    });
    s.lines.forEach(function (l) {
      if (!isSpend(l) || (fundOn() && isYearly(l))) return;
      var m = monthly(l), it = l.cat ? byCat[l.cat] : null;
      if (!it) { items.push({ kind: 'line', id: l.id, name: l.name, amt: m, lines: [l], note: l.f === 'yr' ? YEARLY_NOTE : '' }); return; }
      it.amt += m;
      if (m >= 0.5) { it.lines.push(l); if (l.f === 'yr') it.note = YEARLY_NOTE; }
    });
    return items.filter(function (it) { return it.amt >= 0.5; }).sort(function (a, b) { return b.amt - a.amt; });
  }
  function catTotal(s, id) {
    var t = 0;
    s.lines.forEach(function (l) { if (isSpend(l) && l.cat === id && !(fundOn() && isYearly(l))) t += monthly(l); });
    return t;
  }

  /* ---------- yearly costs fund ---------- */
  function fundMonthly(s) { var c = 0; s.lines.forEach(function (l) { if (isYearly(l)) c += n(l.amt) / 12; }); return c; }
  function fundBills(s) {
    return s.lines.filter(function (l) { return isYearly(l) && dueOf(l); })
      .map(function (l) { return { name: l.name, amt: n(l.amt), due: dueOf(l), acct: l.acct }; });
  }
  // F_k = B + k c − Σ bills due in months m+1..m+k, for k = 1..12; S = max(0, −min F_k).
  function projectFund(B, base, c, bills) {
    var F = B, min = 0, minKey = '', months = [], b0 = monthIndex(base);
    for (var k = 1; k <= 12; k++) {
      var key = monthKey(b0 + k), mo = monthNum(key), D = 0, due = [];
      bills.forEach(function (b) { if (b.due === mo) { D += b.amt; due.push({ name: b.name, amt: b.amt, acct: b.acct }); } });
      F = F + c - D;
      if (due.length) months.push({ key: key, bills: due, F: F });
      if (F < min - 1e-9) { min = F; minKey = key; }
    }
    return { months: months, S: Math.max(0, -min), minKey: min < 0 ? minKey : '' };
  }
  function latestFundEntry(before) {
    for (var i = state.checkins.length - 1; i >= 0; i--) {
      var ci = state.checkins[i];
      if (before && monthIndex(ci.month) >= monthIndex(before)) continue;
      if (ci.fund) return ci;
    }

  function flowSVG(t, c) {
    var list = [{ a: t.land, amt: Math.max(t.keep, 0), keep: true }].concat(t.items);
    list = list.filter(function (x) { return x.amt > 0.5; });
    if (!list.length || c.I <= 0) return '<p class="note">Add income to see the transfer plan.</p>';
    var total = list.reduce(function (a, x) { return a + x.amt; }, 0);
    var BAND = 170, SLOT = 34, GAP = 8, PAD = 6, X1 = 10, X2 = 194, W = 360;
    var k = BAND / Math.max(total, 1);
    list.forEach(function (x) { x.h = Math.max(x.amt * k, 2); x.slot = Math.max(x.h, SLOT); });
    var Hl = list.reduce(function (a, x) { return a + x.h; }, 0);
    var Hr = list.reduce(function (a, x) { return a + x.slot; }, 0) + GAP * (list.length - 1);
    var H = Math.max(Hl, Hr) + PAD * 2;
    var yl = (H - Hl) / 2, ys = (H - Hr) / 2, xm = (X1 + X2) / 2;
    var paths = '', nodes = '', labels = '';
    list.forEach(function (x) {
      var yr = ys + (x.slot - x.h) / 2;
      var col = ACCT_COLOR[x.a] || 'var(--ink-3)';
      paths += '<path d="M' + X1 + ' ' + yl.toFixed(1) + ' C' + xm + ' ' + yl.toFixed(1) + ' ' + xm + ' ' + yr.toFixed(1) + ' ' + X2 + ' ' + yr.toFixed(1) +
        ' L' + X2 + ' ' + (yr + x.h).toFixed(1) + ' C' + xm + ' ' + (yr + x.h).toFixed(1) + ' ' + xm + ' ' + (yl + x.h).toFixed(1) + ' ' + X1 + ' ' + (yl + x.h).toFixed(1) + ' Z" style="fill:' + col + ';opacity:0.28"></path>';
      nodes += '<rect x="' + X2 + '" y="' + yr.toFixed(1) + '" width="8" height="' + x.h.toFixed(1) + '" rx="2" style="fill:' + col + '"></rect>';
      var cy = ys + x.slot / 2;
      labels += '<text x="' + (X2 + 16) + '" y="' + (cy - 3).toFixed(1) + '">' + esc(x.keep ? 'Stays in ' + acctName(x.a) : acctName(x.a)) + '</text>' +
        '<text class="amt-t" x="' + (X2 + 16) + '" y="' + (cy + 12).toFixed(1) + '">' + money(x.amt) + '</text>';
      yl += x.h; ys += x.slot + GAP;
    });
    nodes += '<rect x="0" y="' + ((H - Hl) / 2).toFixed(1) + '" width="' + X1 + '" height="' + Hl.toFixed(1) + '" rx="2" style="fill:var(--ink)"></rect>';
    return '<p class="note">Paychecks (' + money(c.I) + ') land in <b>' + esc(acctName(t.land)) + '</b>.</p>' +
      '<svg viewBox="0 0 ' + W + ' ' + H.toFixed(0) + '" role="img" aria-label="How each paycheck is split between accounts">' + paths + nodes + labels + '</svg>';
  }

  function stepsHTML(s, c, t) {
    var h = '<ol class="steps">';
    t.items.forEach(function (x) {
      var parts = [];
      GROUPS.forEach(function (G) {
        var v = 0; s.lines.forEach(function (l) { if (l.acct === x.a && l.g === G.key && !(fundOn() && isYearly(l))) v += monthly(l); });
        if (v > 0.5) parts.push(G.name.toLowerCase() + ' ' + money(v));
      });
      if (fundOn() && x.a === state.fund.acct && c.fund > 0.5) parts.push('yearly costs fund ' + money(c.fund));
      h += '<li><span>Move to <b>' + esc(acctName(x.a)) + '</b></span><b>' + money(x.amt) + '</b><span class="why">' + esc(parts.join(' + ')) + '</span></li>';
    });
    var unassigned = Math.max(t.keep - t.keepPlanned, 0);
    h += '<li><span>Keep in <b>' + esc(acctName(t.land)) + '</b></span><b>' + money(Math.max(t.keep, 0)) + '</b><span class="why">' +
      'planned spending ' + money(t.keepPlanned) + (unassigned > 0.5 ? ' + ' + money(unassigned) + ' not assigned yet' : '') + '</span></li>';
    h += '</ol>';
    if (t.keep < t.keepPlanned - 0.5) {
      h += '<p class="alert">This plan spends ' + money(t.keepPlanned - t.keep) + ' more than comes in each month. Lower some amounts or add income.</p>';

  /* ---------- export / import ---------- */
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  function showNewer() { banner = newerBanner(); renderBanner(); window.scrollTo(0, 0); }

  function exportPlan() {
    if (blocked) { showNewer(); return; }
    var now = new Date();
    state.lastSync = { at: now.getTime(), kind: 'export', by: deviceName };
    persist();
    var payload = { app: APP_ID, v: DATA_V, exportedAt: now.toISOString(), exportedBy: deviceName, state: state };
    var json = JSON.stringify(payload, null, 2);
    var name = 'budget-plan-' + ymd(now) + '.json';
    var blob = new Blob([json], { type: 'application/json' });
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var file = null;
    try { file = new File([blob], name, { type: 'application/json' }); } catch (e) { file = null; }
    if (touch && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Budget plan' }).then(function () {
        banner = { kind: 'info', html: 'Plan file shared. Save it over the old one so both of you have the latest version.' }; refresh(); renderBanner();
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        download(blob, name);
      });
    } else {
      download(blob, name);
    }
    refresh();
  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    banner = { kind: 'info', html: 'Downloaded <b>' + esc(name) + '</b>. Move it into your shared folder, replacing the old plan file.' };
    renderBanner();
  }

  function startImport() {
    if (blocked) { showNewer(); return; }
    var input = document.getElementById('import-file');
    input.value = '';
    input.click();
  }

  document.getElementById('import-file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var p = null;
      try { p = JSON.parse(String(reader.result)); } catch (err) { p = null; }
      if (p && p.app === APP_ID && (tooNew(p) || tooNew(p.state))) {
        banner = newerBanner();
      } else if (p && p.app === APP_ID && migrate(p.state)) {
        banner = { kind: 'import', payload: p, plan: migrate(p.state) };
      } else {
        banner = { kind: 'error', html: '<b>That file isn’t a budget plan file.</b><small>Choose a file this app exported; its name starts with “budget-plan-”.</small>' };
      }
      renderBanner();
      window.scrollTo(0, 0);
    };
    reader.onerror = function () { banner = { kind: 'error', html: '<b>Couldn’t read that file.</b> Try choosing it again.' }; renderBanner(); };
    reader.readAsText(file);
  });

  function confirmImport() {
    var p = banner.payload;
    state = banner.plan;
    var now = Date.now();
    state.touched = true;
    state.modifiedAt = now;
    state.lastSync = { at: now, kind: 'import', by: p.exportedBy || '' };
    banner = { kind: 'info', html: 'Imported the plan' + (p.exportedBy ? ' from ' + esc(p.exportedBy) : '') + '.' };
    resetView();
    persist();
    renderAll();
  }

      }

  function rerenderEditor(focusId) {

  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;

      changed(); renderAll();

      var fail = function () { copyFallback = true; refresh(); var ta = document.getElementById('hd-copy'); if (ta) { ta.focus(); ta.select(); } };

  window.addEventListener('pagehide', function () { if (saveTimer) { clearTimeout(saveTimer); persist(); } });

  // Another window or tab on this device saved the plan. Switch to what is stored now, read as on load;
  // otherwise this window's older copy would be written over it on the next edit here or on pagehide.
  // Nothing is written back from here: this window next saves on its own next edit.
  function syncFromStorage() {
    var raw = lsGet(PLAN_KEY);
    if (blocked || raw === seenRaw) return; // nothing new since this window last read or wrote it
    seenRaw = raw;
    var r = readStored(raw);
    if (!r.plan && !r.newer) return; // removed or unreadable: keep this plan (readStored backed the value up)
    clearTimeout(saveTimer); saveTimer = null; // drop an unsaved edit rather than save it over the other window's plan
    if (r.newer) { blocked = true; banner = newerBanner(); refresh(); renderBanner(); return; }
    state = r.plan; savedAt = Date.now(); storageOk = true;

    resetView(); pendingReset = false;

  // A page restored from the back/forward cache may not have been told about saves made while it was away.
  window.addEventListener('pageshow', function (e) { if (e.persisted) syncFromStorage(); });

  renderAll();

  /* ---------- tour ---------- */
  var TOUR = [

    { sel: '[data-tour="checkin"]', title: 'Monthly check-in',

    { sel: '[data-tour="want"]', title: 'Variable spending',

    { sel: '[data-tour="categories"]', title: 'Honeydue categories',
      text: 'Group your lines into the categories you use in Honeydue. Rename, add or delete them any time; the Honeydue limits add up the lines in each one.' },
    { sel: '[data-tour="yearly"]', title: 'Yearly costs',

    { sel: '[data-tour="accounts"]', title: 'Accounts',

    { sel: '[data-tour="transfers"]', title: 'Payday transfer plan',

    { sel: '[data-tour="goals"]', title: 'Savings goals',

    { sel: '[data-tour="compare"]', title: 'Compare scenarios',

    { sel: null, title: 'That’s the tour',
      text: 'Replay it any time with the Tour button at the top. Your plan is saved on this device as you type.' }
  ];
  var tourSteps = [], tourI = -1;

  function ensureTour() {
    if (document.getElementById('tour')) return;
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div id="tour-block" class="tour-block" hidden></div><div id="tour-spot" class="tour-spot" hidden></div>' +
      '<div id="tour" class="tour" role="dialog" aria-modal="true" aria-labelledby="tour-title" hidden><div class="tour-in">' +
      '<div class="tour-top"><span id="tour-n"></span><button class="icon" type="button" data-tour-act="close" aria-label="Close tour" title="Close">×</button></div>' +
      '<h2 id="tour-title"></h2><p id="tour-text"></p>' +
      '<div class="tour-btns"><button class="btn" type="button" data-tour-act="back">Back</button><button class="btn primary" type="button" data-tour-act="next">Next</button></div>' +
      '</div></div>';
    while (wrap.firstChild) document.body.appendChild(wrap.firstChild);
    document.getElementById('tour').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tour-act]'); if (!b) return;
      var a = b.getAttribute('data-tour-act');
      if (a === 'close') endTour();
      else if (a === 'back') showStep(tourI - 1);
      else if (a === 'next') { if (tourI >= tourSteps.length - 1) endTour(); else showStep(tourI + 1); }
    });
  }
  function reducedMotion() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

  function startTour() {
    lsSet(TOUR_KEY, '1');
    if (banner && banner.kind === 'tour') { banner = null; renderBanner(); }
    ensureTour();
    tourSteps = TOUR.filter(function (st) { return !st.sel || document.querySelector(st.sel); });
    root.inert = true; root.setAttribute('aria-hidden', 'true');
    ['tour-block', 'tour-spot', 'tour'].forEach(function (id) { document.getElementById(id).hidden = false; });
    showStep(0);
    document.querySelector('#tour [data-tour-act="next"]').focus();
  }
  function showStep(i) {
    if (!tourSteps.length) return;
    tourI = Math.max(0, Math.min(i, tourSteps.length - 1));
    var st = tourSteps[tourI], last = tourI === tourSteps.length - 1;
    document.getElementById('tour-n').textContent = (tourI + 1) + ' of ' + tourSteps.length;
    document.getElementById('tour-title').textContent = st.title;
    document.getElementById('tour-text').textContent = st.text;
    document.querySelector('#tour [data-tour-act="back"]').disabled = tourI === 0;
    document.querySelector('#tour [data-tour-act="next"]').textContent = last ? 'Finish' : 'Next';
    // Room below the page so the last parts can scroll above the caption bar.
    document.body.style.paddingBottom = (document.querySelector('#tour .tour-in').offsetHeight + 24) + 'px';
    placeSpot(true);
  }
  function placeSpot(scroll) {
    if (tourI < 0) return;
    var st = tourSteps[tourI], el = st && st.sel ? document.querySelector(st.sel) : null;
    var spot = document.getElementById('tour-spot'), block = document.getElementById('tour-block');
    if (!el) { spot.hidden = true; block.classList.add('dim'); return; }
    block.classList.remove('dim'); spot.hidden = false;
    if (scroll) el.scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' });
    var r = el.getBoundingClientRect(), pad = 6;
    spot.style.top = (r.top - pad) + 'px'; spot.style.left = (r.left - pad) + 'px';
    spot.style.width = (r.width + pad * 2) + 'px'; spot.style.height = (r.height + pad * 2) + 'px';
  }
  function endTour() {
    if (tourI < 0) return;
    tourI = -1;
    ['tour-block', 'tour-spot', 'tour'].forEach(function (id) { document.getElementById(id).hidden = true; });
    root.inert = false; root.removeAttribute('aria-hidden');
    document.body.style.paddingBottom = '';
    var tb = document.getElementById('tour-btn'); if (tb) tb.focus();
  }
  window.addEventListener('scroll', function () { placeSpot(false); }, { passive: true });
  window.addEventListener('resize', function () { placeSpot(false); });
  document.addEventListener('keydown', function (e) {
    if (tourI < 0) return;
    if (e.key === 'Escape') { e.preventDefault(); endTour(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (tourI >= tourSteps.length - 1) endTour(); else showStep(tourI + 1); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); showStep(tourI - 1); return; }
    if (e.key === 'Tab') {
      var f = Array.prototype.filter.call(document.querySelectorAll('#tour button'), function (b) { return !b.disabled; });
      if (!f.length) return;
      var k = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(k + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });

  // Read-only hooks for tests/smoke.js (no data leaves the device).
  window.__hbp = {

    spendRows: function (m) { return spendRows(scn(), m); },
    dateStatus: dateStatus, paceStatus: paceStatus, projectFund: projectFund,
    tourState: function () { var st = tourSteps[tourI]; return { i: tourI, n: tourSteps.length, sel: st ? st.sel : null }; }
  };

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
